[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "evi"
version = "0.1.0"
description = "Python reference implementation of the Elephant Visibility Index (EVI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Elephant Accountability", email = "chris@eaccountability.org" }
]
keywords = ["evi", "agentic-commerce", "agent-readiness", "scoring", "trustmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "extruct>=0.16",  # JSON-LD / microdata extraction
    "tldextract>=5.1",
    "cryptography>=42.0",  # JWS verification for signed manifests
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://eaccountability.org"
Methodology = "https://eaccountability.org/methodology"
Source = "https://github.com/elephant-accountability/evi-python"
Spec = "https://github.com/elephant-accountability/evi"
Issues = "https://github.com/elephant-accountability/evi-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/evi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
